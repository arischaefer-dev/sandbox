<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1a1a3e" />
  <title>Math Run!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{
      font-family:'Fredoka',sans-serif;
      background:#0d0d2b;
      color:#fff;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .app{
      width:100%;max-width:420px;height:100vh;height:100dvh;
      position:relative;overflow:hidden;
      background:linear-gradient(180deg,#1a1a3e 0%,#0d0d2b 100%);
    }

    /* ── shared ── */
    .screen{position:absolute;inset:0;display:flex;flex-direction:column;transition:opacity .3s,transform .3s;opacity:0;pointer-events:none;transform:translateY(20px)}
    .screen.active{opacity:1;pointer-events:auto;transform:translateY(0)}

    .top-bar{
      display:flex;justify-content:space-between;align-items:center;
      padding:12px 16px 8px;gap:6px;flex-shrink:0;
    }
    .stat-pill{
      display:flex;align-items:center;gap:4px;
      background:rgba(255,255,255,.12);backdrop-filter:blur(6px);
      border-radius:20px;padding:5px 12px;font-size:.85rem;font-weight:600;
    }
    .stat-pill .icon{font-size:1rem}

    .btn-play{
      font-family:inherit;font-size:1.5rem;font-weight:700;letter-spacing:1px;
      padding:16px 0;width:100%;border:none;border-radius:16px;cursor:pointer;
      background:linear-gradient(180deg,#3dd64e 0%,#28a836 100%);
      color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3);
      box-shadow:0 6px 0 #1e8a2a,0 8px 24px rgba(40,168,54,.4);
      transition:transform .1s,box-shadow .1s;
      text-transform:uppercase;
    }
    .btn-play:active{transform:translateY(4px);box-shadow:0 2px 0 #1e8a2a}

    /* ── welcome screen ── */
    #welcome-screen{
      justify-content:center;align-items:center;padding:32px;gap:20px;
      background:linear-gradient(180deg,#1a1a3e 0%,#2d1b69 50%,#0d0d2b 100%);
    }
    .welcome-mascot{font-size:6rem;animation:float 2s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    .welcome-title{font-size:2.4rem;font-weight:700;text-align:center;
      background:linear-gradient(180deg,#ffe066,#ffad33);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
      filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));
    }
    .welcome-sub{color:rgba(255,255,255,.6);font-size:1rem;text-align:center}
    .name-input{
      font-family:inherit;font-size:1.3rem;font-weight:600;
      padding:14px 20px;width:100%;max-width:300px;
      border:3px solid rgba(255,255,255,.2);border-radius:16px;
      background:rgba(255,255,255,.08);color:#fff;text-align:center;
      outline:none;transition:border-color .2s;
    }
    .name-input::placeholder{color:rgba(255,255,255,.3)}
    .name-input:focus{border-color:#3dd64e}
    .welcome-play{max-width:300px}

    /* ── home screen ── */
    #home-screen{background:linear-gradient(180deg,#1a1a3e 0%,#2d1b69 60%,#0d0d2b 100%)}

    .home-body{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 16px;overflow-y:auto;gap:14px}

    .character-area{
      position:relative;display:flex;align-items:flex-end;justify-content:center;
      width:100%;padding:8px 0 0;
    }
    .character{font-size:7rem;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5));cursor:pointer;
      transition:transform .2s;animation:idle 2.5s ease-in-out infinite}
    .character:active{transform:scale(1.1)}
    @keyframes idle{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}

    .info-cards{width:100%;display:flex;flex-direction:column;gap:10px}

    .info-card{
      display:flex;align-items:center;justify-content:space-between;
      background:linear-gradient(135deg,rgba(50,50,120,.7),rgba(30,30,80,.9));
      border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px 18px;
    }
    .info-card .label{font-size:.85rem;color:rgba(255,255,255,.5);font-weight:600}
    .info-card .value{font-size:1.6rem;font-weight:700}
    .info-card .value.gold{color:#ffe066}
    .info-card .value.blue{color:#74b9ff}
    .info-card .icon-big{font-size:1.8rem}

    .progress-bar-container{
      width:100%;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 16px;
      display:flex;align-items:center;gap:12px;
    }
    .progress-track{flex:1;height:10px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,#3dd64e,#ffe066);border-radius:5px;transition:width .4s}
    .progress-label{font-size:.8rem;font-weight:600;color:rgba(255,255,255,.5);white-space:nowrap}

    .level-row{
      display:flex;width:100%;gap:8px;
    }
    .level-chip{
      flex:1;font-family:inherit;font-size:.85rem;font-weight:700;
      padding:10px 0;border:2px solid rgba(255,255,255,.15);border-radius:12px;
      background:rgba(255,255,255,.05);color:rgba(255,255,255,.4);cursor:pointer;
      transition:all .15s;text-align:center;
    }
    .level-chip.active{border-color:#3dd64e;color:#3dd64e;background:rgba(61,214,78,.1)}

    .home-footer{padding:10px 16px 20px;flex-shrink:0}

    .change-name-link{
      display:block;text-align:center;margin-top:8px;
      font-size:.75rem;color:rgba(255,255,255,.25);cursor:pointer;
      background:none;border:none;font-family:inherit;
    }
    .change-name-link:hover{color:rgba(255,255,255,.5)}

    /* ── game screen ── */
    #game-screen{background:linear-gradient(180deg,#0f2027 0%,#203a43 40%,#2c5364 100%)}

    .game-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px;gap:20px}

    .q-num{font-size:.9rem;color:rgba(255,255,255,.4);font-weight:600}
    .question-card{
      width:100%;background:linear-gradient(135deg,rgba(50,80,120,.8),rgba(30,50,80,.95));
      border:1px solid rgba(255,255,255,.15);border-radius:20px;
      padding:28px 20px;text-align:center;
    }
    .question-text{font-size:2.6rem;font-weight:700}

    .answers-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}

    .ans-btn{
      font-family:inherit;font-size:1.8rem;font-weight:700;
      padding:20px 10px;border:none;border-radius:16px;cursor:pointer;color:#fff;
      transition:transform .1s,box-shadow .1s;position:relative;overflow:hidden;
    }
    .ans-btn:nth-child(1){background:linear-gradient(180deg,#f8a5c2,#e05a6f);box-shadow:0 5px 0 #b8445a}
    .ans-btn:nth-child(2){background:linear-gradient(180deg,#78e08f,#38ada9);box-shadow:0 5px 0 #2b8a82}
    .ans-btn:nth-child(3){background:linear-gradient(180deg,#74b9ff,#4a69bd);box-shadow:0 5px 0 #3b5498}
    .ans-btn:nth-child(4){background:linear-gradient(180deg,#fdcb6e,#e17055);box-shadow:0 5px 0 #c0543e}
    .ans-btn:active{transform:translateY(3px);box-shadow:none}

    .ans-btn.correct{background:linear-gradient(180deg,#00b894,#009975)!important;box-shadow:0 5px 0 #007a5e!important;animation:popBtn .4s ease}
    .ans-btn.wrong{background:linear-gradient(180deg,#d63031,#b71c1c)!important;box-shadow:0 5px 0 #8b1515!important;animation:shakeBtn .4s ease}

    @keyframes popBtn{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
    @keyframes shakeBtn{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

    .game-feedback{
      font-size:1.3rem;font-weight:700;min-height:36px;text-align:center;
      transition:opacity .2s;
    }
    .game-feedback.correct{color:#00b894}
    .game-feedback.wrong{color:#e17055}

    .streak-badge{
      position:absolute;top:10px;right:10px;
      background:linear-gradient(135deg,#ff6b6b,#ee5a24);
      border-radius:10px;padding:4px 10px;font-size:.75rem;font-weight:700;
      box-shadow:0 2px 8px rgba(238,90,36,.4);
      animation:pulse 1s infinite;
    }
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

    /* ── result screen ── */
    #result-screen{
      justify-content:center;align-items:center;padding:32px;gap:16px;
      background:linear-gradient(180deg,#1a1a3e 0%,#2d1b69 50%,#0d0d2b 100%);
    }
    .result-mascot{font-size:5rem;animation:float 2s ease-in-out infinite}
    .result-title{font-size:2rem;font-weight:700;text-align:center;
      background:linear-gradient(180deg,#ffe066,#ffad33);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }
    .result-cards{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}
    .result-card{
      display:flex;justify-content:space-between;align-items:center;
      background:rgba(255,255,255,.08);border-radius:14px;padding:14px 18px;
    }
    .result-card .rlabel{font-size:.9rem;color:rgba(255,255,255,.5)}
    .result-card .rval{font-size:1.4rem;font-weight:700}
    .result-card .rval.gold{color:#ffe066}
    .result-card .rval.green{color:#3dd64e}
    .result-play{max-width:300px;margin-top:8px}
    .result-home-btn{
      font-family:inherit;font-size:1rem;font-weight:600;
      background:none;border:2px solid rgba(255,255,255,.2);border-radius:12px;
      color:rgba(255,255,255,.5);padding:10px 0;width:100%;max-width:300px;
      cursor:pointer;transition:all .15s;
    }
    .result-home-btn:hover{border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.7)}

    .new-best{
      font-size:1rem;font-weight:700;color:#ffe066;
      animation:pulse 1s infinite;text-align:center;
    }

    /* ── coin fly animation ── */
    .coin-fly{
      position:fixed;font-size:1.4rem;pointer-events:none;z-index:999;
      animation:coinUp .8s ease-out forwards;
    }
    @keyframes coinUp{
      0%{opacity:1;transform:translateY(0) scale(1)}
      100%{opacity:0;transform:translateY(-80px) scale(1.4)}
    }

    /* ── multiplier popup ── */
    .mult-popup{
      position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
      font-size:3rem;font-weight:700;z-index:999;pointer-events:none;
      background:linear-gradient(180deg,#ffe066,#ffad33);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
      filter:drop-shadow(0 2px 8px rgba(255,173,51,.5));
      animation:multPop .6s ease forwards;
    }
    @keyframes multPop{0%{transform:translate(-50%,-50%) scale(0)}40%{transform:translate(-50%,-50%) scale(1.3)}100%{transform:translate(-50%,-50%) scale(0);opacity:0}}
  </style>
</head>
<body>

<div class="app">

  <!-- WELCOME -->
  <div class="screen active" id="welcome-screen">
    <div class="welcome-mascot">🧮</div>
    <div class="welcome-title">Math Run!</div>
    <div class="welcome-sub">What's your name?</div>
    <input class="name-input" id="name-input" type="text" placeholder="Your name…" maxlength="16" autofocus />
    <button class="btn-play welcome-play" id="welcome-go" disabled>LET'S GO!</button>
  </div>

  <!-- HOME -->
  <div class="screen" id="home-screen">
    <div class="top-bar">
      <div class="stat-pill"><span class="icon">⭐</span><span id="h-stars">0</span></div>
      <div class="stat-pill"><span class="icon">🪙</span><span id="h-coins">0</span></div>
      <div class="stat-pill"><span class="icon">🔥</span> x<span id="h-mult">1</span></div>
    </div>

    <div class="home-body">
      <div class="character-area">
        <div class="character" id="h-char" title="Tap to change">🧒</div>
      </div>

      <div class="info-cards">
        <div class="info-card">
          <div><div class="label">Score</div><div class="value gold" id="h-score">0</div></div>
          <div class="icon-big">⭐</div>
        </div>
        <div class="info-card">
          <div><div class="label">Coins</div><div class="value blue" id="h-coins2">0</div></div>
          <div class="icon-big">🪙</div>
        </div>
      </div>

      <div class="progress-bar-container">
        <span style="font-size:1.2rem">📚</span>
        <div class="progress-track"><div class="progress-fill" id="h-prog" style="width:0%"></div></div>
        <span class="progress-label" id="h-prog-label">0 / 10</span>
      </div>

      <div class="level-row">
        <button class="level-chip active" data-level="easy">Easy<br/>+  −</button>
        <button class="level-chip" data-level="medium">Medium<br/>×</button>
        <button class="level-chip" data-level="hard">Hard<br/>÷</button>
      </div>
    </div>

    <div class="home-footer">
      <button class="btn-play" id="play-btn">PLAY</button>
      <button class="change-name-link" id="change-name-btn">change player</button>
    </div>
  </div>

  <!-- GAME -->
  <div class="screen" id="game-screen">
    <div class="top-bar">
      <div class="stat-pill"><span class="icon">⭐</span><span id="g-score">0</span></div>
      <div class="stat-pill"><span class="icon">🪙</span>+<span id="g-coins-add">0</span></div>
      <div class="stat-pill"><span class="icon">🔥</span><span id="g-streak">0</span></div>
    </div>

    <div class="game-body">
      <div class="q-num" id="g-qnum">Question 1 / 10</div>

      <div class="question-card">
        <div class="question-text" id="g-question">…</div>
      </div>

      <div class="answers-grid" id="g-answers"></div>

      <div class="game-feedback" id="g-feedback"></div>
    </div>
  </div>

  <!-- RESULT -->
  <div class="screen" id="result-screen">
    <div class="result-mascot" id="r-mascot">🏆</div>
    <div class="result-title" id="r-title">Great Job!</div>
    <div class="new-best" id="r-newbest" style="display:none">⭐ NEW BEST SCORE! ⭐</div>
    <div class="result-cards">
      <div class="result-card"><span class="rlabel">Score</span><span class="rval gold" id="r-score">0</span></div>
      <div class="result-card"><span class="rlabel">Correct</span><span class="rval green" id="r-correct">0 / 10</span></div>
      <div class="result-card"><span class="rlabel">Coins earned</span><span class="rval" id="r-coins">+0 🪙</span></div>
      <div class="result-card"><span class="rlabel">Best streak</span><span class="rval" id="r-streak">0 🔥</span></div>
      <div class="result-card"><span class="rlabel">Best score</span><span class="rval gold" id="r-best">0</span></div>
    </div>
    <button class="btn-play result-play" id="r-play">PLAY AGAIN</button>
    <button class="result-home-btn" id="r-home">Home</button>
  </div>

</div>

<script>
const STORAGE_KEY = 'mathrun_v2';
const ROUNDS = 10;
const CHARACTERS = ['🧒','👦','👧','🧒🏽','👦🏿','👧🏻','🧒🏾','👦🏼','👧🏽','🦸','🦸‍♀️','🧙','🧝','🧛'];

let state = {
  name:'', coins:0, bestScore:0, totalCorrect:0, charIdx:0, level:'easy'
};

let gScore=0, gStreak=0, gBestStreak=0, gCorrect=0, gCoins=0, gQ=0, gAnswer=0, gLocked=false;

function load(){
  try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY));if(d)Object.assign(state,d)}catch(e){}
}
function save(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}

function multiplier(){
  if(gStreak>=10) return 4;
  if(gStreak>=5) return 3;
  if(gStreak>=3) return 2;
  return 1;
}

/* ── Welcome ── */
const nameIn=document.getElementById('name-input');
const goBtn=document.getElementById('welcome-go');
nameIn.addEventListener('input',()=>{goBtn.disabled=!nameIn.value.trim()});
nameIn.addEventListener('keydown',e=>{if(e.key==='Enter'&&nameIn.value.trim())enterHome()});
goBtn.addEventListener('click',enterHome);

function enterHome(){
  state.name=nameIn.value.trim();
  if(!state.name)return;
  save();
  refreshHome();
  show('home-screen');
}

/* ── Home ── */
function refreshHome(){
  document.getElementById('h-stars').textContent=state.bestScore;
  document.getElementById('h-coins').textContent=state.coins;
  document.getElementById('h-coins2').textContent=state.coins;
  document.getElementById('h-score').textContent=state.bestScore;
  document.getElementById('h-mult').textContent='1';
  document.getElementById('h-char').textContent=CHARACTERS[state.charIdx];
  document.getElementById('h-prog-label').textContent=`${state.totalCorrect % ROUNDS} / ${ROUNDS}`;
  document.getElementById('h-prog').style.width=`${((state.totalCorrect%ROUNDS)/ROUNDS)*100}%`;
  document.querySelectorAll('.level-chip').forEach(c=>{
    c.classList.toggle('active',c.dataset.level===state.level);
  });
}

document.querySelectorAll('.level-chip').forEach(c=>{
  c.addEventListener('click',()=>{state.level=c.dataset.level;save();refreshHome()});
});

document.getElementById('h-char').addEventListener('click',()=>{
  state.charIdx=(state.charIdx+1)%CHARACTERS.length;
  save();refreshHome();
});

document.getElementById('change-name-btn').addEventListener('click',()=>{
  localStorage.removeItem(STORAGE_KEY);location.reload();
});

document.getElementById('play-btn').addEventListener('click',startRound);

/* ── Game ── */
function startRound(){
  gScore=0;gStreak=0;gBestStreak=0;gCorrect=0;gCoins=0;gQ=0;gLocked=false;
  show('game-screen');
  nextQuestion();
}

function genQuestion(){
  let a,b,answer,text;
  if(state.level==='easy'){
    const op=Math.random()<0.5;
    a=rand(1,10);b=rand(1,10);
    if(!op&&a<b)[a,b]=[b,a];
    answer=op?a+b:a-b;
    text=`${a} ${op?'+':'−'} ${b}`;
  }else if(state.level==='medium'){
    a=rand(1,5);b=rand(1,5);
    answer=a*b;text=`${a} × ${b}`;
  }else{
    b=rand(1,5);answer=rand(1,5);a=b*answer;
    text=`${a} ÷ ${b}`;
  }
  return{text,answer};
}

function nextQuestion(){
  if(gQ>=ROUNDS){endRound();return}
  gQ++;gLocked=false;
  document.getElementById('g-feedback').textContent='';
  document.getElementById('g-feedback').className='game-feedback';
  document.getElementById('g-qnum').textContent=`Question ${gQ} / ${ROUNDS}`;
  document.getElementById('g-score').textContent=gScore;
  document.getElementById('g-coins-add').textContent=gCoins;
  document.getElementById('g-streak').textContent=gStreak;

  const{text,answer}=genQuestion();
  gAnswer=answer;
  document.getElementById('g-question').textContent=`${text} = ?`;

  const wrong=new Set();
  while(wrong.size<3){const w=answer+rand(-5,5);if(w!==answer&&w>=0)wrong.add(w)}
  const choices=shuffle([answer,...wrong]);
  const cont=document.getElementById('g-answers');
  cont.innerHTML='';
  choices.forEach(c=>{
    const b=document.createElement('button');
    b.className='ans-btn';b.textContent=c;
    b.onclick=()=>handleAns(b,c);
    cont.appendChild(b);
  });
}

function handleAns(btn,choice){
  if(gLocked)return;
  gLocked=true;
  const fb=document.getElementById('g-feedback');

  if(choice===gAnswer){
    btn.classList.add('correct');
    gStreak++;
    if(gStreak>gBestStreak)gBestStreak=gStreak;
    const m=multiplier();
    const pts=10*m;
    const coinGain=rand(2,5)*m;
    gScore+=pts;gCoins+=coinGain;gCorrect++;

    if(m>1)showMultPopup(`x${m}!`);
    spawnCoinFly(btn);

    fb.textContent=[`Amazing, ${state.name}!`,`Super, ${state.name}!`,`${state.name}, you rock!`,`Wow!`,`Brilliant!`,`Perfect!`][rand(0,5)];
    fb.className='game-feedback correct';

    document.getElementById('g-score').textContent=gScore;
    document.getElementById('g-coins-add').textContent=gCoins;
    document.getElementById('g-streak').textContent=gStreak;

    setTimeout(nextQuestion,900);
  }else{
    btn.classList.add('wrong');
    gStreak=0;
    document.querySelectorAll('.ans-btn').forEach(b=>{if(parseInt(b.textContent)===gAnswer)b.classList.add('correct')});
    fb.textContent=`It's ${gAnswer}. Keep going!`;
    fb.className='game-feedback wrong';
    document.getElementById('g-streak').textContent=0;
    setTimeout(nextQuestion,1400);
  }
}

function spawnCoinFly(btn){
  const r=btn.getBoundingClientRect();
  const el=document.createElement('div');
  el.className='coin-fly';el.textContent='🪙';
  el.style.left=r.left+r.width/2-10+'px';
  el.style.top=r.top+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),800);
}

function showMultPopup(txt){
  const el=document.createElement('div');
  el.className='mult-popup';el.textContent=txt;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),600);
}

/* ── Results ── */
function endRound(){
  state.coins+=gCoins;
  state.totalCorrect+=gCorrect;
  const isNew=gScore>state.bestScore;
  if(isNew)state.bestScore=gScore;
  save();

  document.getElementById('r-mascot').textContent=gCorrect>=8?'🏆':gCorrect>=5?'🎉':'💪';
  document.getElementById('r-title').textContent=
    gCorrect>=8?`Amazing, ${state.name}!`:gCorrect>=5?`Great job, ${state.name}!`:`Keep going, ${state.name}!`;
  document.getElementById('r-score').textContent=gScore;
  document.getElementById('r-correct').textContent=`${gCorrect} / ${ROUNDS}`;
  document.getElementById('r-coins').textContent=`+${gCoins} 🪙`;
  document.getElementById('r-streak').textContent=`${gBestStreak} 🔥`;
  document.getElementById('r-best').textContent=state.bestScore;
  document.getElementById('r-newbest').style.display=isNew?'block':'none';

  show('result-screen');
}

document.getElementById('r-play').addEventListener('click',startRound);
document.getElementById('r-home').addEventListener('click',()=>{refreshHome();show('home-screen')});

/* ── Init ── */
load();
if(state.name){
  refreshHome();
  show('home-screen');
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js')}
</script>
</body>
</html>
