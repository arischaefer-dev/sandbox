<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grade 1 Learning Arcade</title>
  <style>
    :root {
      --pink: #ff6f91;
      --purple: #8f5cff;
      --blue: #45aaf2;
      --green: #2ecc71;
      --yellow: #f9ca24;
      --orange: #ff9f43;
      --ink: #2f3640;
      --card: rgba(255, 255, 255, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Comic Sans MS", "Trebuchet MS", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 20%, #ffd3e0, transparent 35%),
        radial-gradient(circle at 80% 20%, #d6e6ff, transparent 35%),
        linear-gradient(150deg, #fff7ea 0%, #fff3f7 45%, #eef7ff 100%);
      min-height: 100vh;
      padding: 18px;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      gap: 14px;
    }

    .title {
      text-align: center;
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      color: #ffffff;
      text-shadow: 2px 2px 0 #ff5c8a, -1px -1px 0 #ff5c8a;
      background: linear-gradient(135deg, #ff8fab, #b388ff);
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 10px 22px rgba(143, 92, 255, 0.25);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .stat {
      background: var(--card);
      border-radius: 14px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      border: 2px solid #ffffff;
      font-size: 1rem;
      min-height: 74px;
      display: grid;
      place-items: center;
    }

    .stat strong {
      font-size: 1.35rem;
      color: var(--purple);
    }

    .games {
      background: var(--card);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .game-btn {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      color: #ffffff;
      background: #778ca3;
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.15);
      font-size: 0.95rem;
    }

    .game-btn[data-key="addition"] { background: var(--pink); }
    .game-btn[data-key="multiplication"] { background: var(--purple); }
    .game-btn[data-key="division"] { background: var(--blue); }
    .game-btn[data-key="pathway"] { background: var(--orange); }
    .game-btn[data-key="venn"] { background: var(--green); }
    .game-btn[data-key="patterns"] { background: var(--yellow); color: #5c4300; }

    .game-btn.active {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 7px 0 rgba(0, 0, 0, 0.18);
      outline: 3px solid #ffffff;
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.1);
      padding: 18px;
      display: grid;
      gap: 14px;
      min-height: 430px;
      align-content: start;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .game-name {
      font-size: clamp(1.4rem, 2.8vw, 2rem);
      color: var(--purple);
      font-weight: 800;
    }

    .mascot {
      font-size: 2rem;
      animation: bounce 1.2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .prompt {
      font-size: clamp(1.35rem, 2.8vw, 2rem);
      font-weight: 700;
      text-align: center;
      min-height: 76px;
      display: grid;
      place-items: center;
      background: #f8faff;
      border-radius: 14px;
      padding: 10px;
      border: 2px dashed #c7d2fe;
    }

    .visual {
      min-height: 82px;
      display: grid;
      place-items: center;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .option-btn {
      border: none;
      border-radius: 14px;
      padding: 14px 10px;
      font-size: clamp(1.1rem, 2.2vw, 1.4rem);
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.16);
      transition: transform 0.1s ease;
      background: linear-gradient(135deg, #7f8fa6, #576574);
      min-height: 68px;
    }

    .option-btn:nth-child(1) { background: linear-gradient(135deg, #ff7aa2, #ff5d86); }
    .option-btn:nth-child(2) { background: linear-gradient(135deg, #7d8dff, #5d69ff); }
    .option-btn:nth-child(3) { background: linear-gradient(135deg, #3bd6a2, #15b57f); }
    .option-btn:nth-child(4) { background: linear-gradient(135deg, #ffbe4b, #ff9f1a); }

    .option-btn:disabled {
      opacity: 0.85;
      cursor: not-allowed;
    }

    .option-btn.correct {
      outline: 4px solid #16a34a;
      transform: scale(1.02);
    }

    .option-btn.wrong {
      outline: 4px solid #ef4444;
      transform: scale(0.98);
    }

    .feedback {
      font-size: 1.2rem;
      text-align: center;
      min-height: 34px;
      font-weight: 800;
    }

    .feedback.ok { color: #0f9f43; }
    .feedback.nope { color: #d63031; }

    .pathway {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
      font-weight: 800;
    }

    .chip {
      background: #fff;
      border-radius: 999px;
      border: 2px solid #c5d6ff;
      padding: 8px 12px;
      min-width: 58px;
      text-align: center;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.08);
    }

    .arrow {
      font-size: 1.15rem;
      color: #6b7280;
    }

    .venn-box {
      width: min(360px, 100%);
      display: grid;
      place-items: center;
      padding: 10px 0 6px;
    }

    .venn {
      width: 310px;
      height: 150px;
      position: relative;
    }

    .circle {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      display: grid;
      place-items: start center;
      padding-top: 9px;
      font-weight: 700;
      color: #1f2937;
      font-size: 0.85rem;
    }

    .circle.a {
      left: 26px;
      background: rgba(255, 129, 167, 0.38);
      border: 2px solid #ff5d86;
    }

    .circle.b {
      right: 26px;
      background: rgba(102, 187, 255, 0.35);
      border: 2px solid #3796ff;
    }

    .item-pill {
      margin-top: 6px;
      background: #ffffff;
      border: 2px solid #111827;
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 800;
      font-size: 0.95rem;
    }

    .footer-note {
      text-align: center;
      color: #5b6471;
      font-size: 0.9rem;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1 class="title">Grade 1 Learning Arcade</h1>

    <section class="stats">
      <div class="stat">Score<br /><strong id="score">0</strong></div>
      <div class="stat">Streak<br /><strong id="streak">0</strong></div>
      <div class="stat">Stars<br /><strong id="stars">0</strong></div>
      <div class="stat">Game<br /><strong id="game-short">Addition</strong></div>
    </section>

    <section class="games" id="game-picker"></section>

    <section class="card">
      <div class="header-row">
        <div class="game-name" id="game-name">Simple Addition</div>
        <div class="mascot" id="mascot" aria-hidden="true">🐻</div>
      </div>

      <div class="prompt" id="prompt">Loading question...</div>
      <div class="visual" id="visual"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="footer-note">Tap the best answer and keep learning.</div>
    </section>
  </main>

  <script>
    const mascots = ["🐻", "🦊", "🐯", "🦁", "🐼", "🐰", "🐸", "🐶"];
    const cheers = [
      "Great job!",
      "Nice work!",
      "Awesome!",
      "You got it!",
      "Brilliant!",
      "Super thinking!"
    ];

    const state = {
      gameKey: "addition",
      score: 0,
      streak: 0,
      locked: false,
      timerId: null,
      currentQuestion: null
    };

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffled(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildNumericOptions(answer, min = 0, max = 30) {
      const values = new Set([answer]);
      let guard = 0;

      while (values.size < 4 && guard < 120) {
        guard += 1;
        const delta = randInt(-6, 6);
        if (delta === 0) continue;
        const candidate = answer + delta;
        if (candidate >= min && candidate <= max) values.add(candidate);
      }

      if (values.size < 4) {
        for (let n = min; n <= max && values.size < 4; n++) {
          if (n !== answer) values.add(n);
        }
      }

      const options = shuffled([...values]);
      return {
        options: options.map((value) => String(value)),
        correctIndex: options.indexOf(answer)
      };
    }

    function gameAddition() {
      const a = randInt(0, 10);
      const b = randInt(0, 10);
      const answer = a + b;
      const data = buildNumericOptions(answer, 0, 20);

      return {
        prompt: `${a} + ${b} = ?`,
        visualHtml: "",
        options: data.options,
        correctIndex: data.correctIndex,
        points: 10
      };
    }

    function gameMultiplication() {
      const a = randInt(1, 5);
      const b = randInt(1, 5);
      const answer = a * b;
      const data = buildNumericOptions(answer, 0, 30);

      return {
        prompt: `${a} × ${b} = ?`,
        visualHtml: "",
        options: data.options,
        correctIndex: data.correctIndex,
        points: 12
      };
    }

    function gameDivision() {
      const divisor = randInt(1, 5);
      const quotient = randInt(1, 10);
      const dividend = divisor * quotient;
      const answer = quotient;
      const data = buildNumericOptions(answer, 0, 12);

      return {
        prompt: `${dividend} ÷ ${divisor} = ?`,
        visualHtml: "",
        options: data.options,
        correctIndex: data.correctIndex,
        points: 14
      };
    }

    function gamePathway() {
      let current = randInt(2, 10);
      const start = current;
      const operations = [];

      for (let i = 0; i < 3; i++) {
        const shouldSubtract = Math.random() < 0.35 && current > 3;
        const amount = randInt(1, 4);
        const sign = shouldSubtract && current - amount >= 0 ? "-" : "+";
        const delta = sign === "-" ? -amount : amount;
        operations.push(`${sign}${amount}`);
        current += delta;
      }

      const answer = current;
      const data = buildNumericOptions(answer, 0, 25);
      const pieces = [`<span class="chip">${start}</span>`];

      operations.forEach((op) => {
        pieces.push(`<span class="arrow">→</span>`);
        pieces.push(`<span class="chip">${op}</span>`);
      });
      pieces.push(`<span class="arrow">→</span><span class="chip">?</span>`);

      return {
        prompt: "Follow the pathway. Where do you end?",
        visualHtml: `<div class="pathway">${pieces.join("")}</div>`,
        options: data.options,
        correctIndex: data.correctIndex,
        points: 16
      };
    }

    const vennThemes = [
      {
        setA: "Animals",
        setB: "Can Fly",
        items: [
          { name: "Bird", a: true, b: true },
          { name: "Dog", a: true, b: false },
          { name: "Airplane", a: false, b: true },
          { name: "Book", a: false, b: false }
        ]
      },
      {
        setA: "Red Things",
        setB: "Round Things",
        items: [
          { name: "Apple", a: true, b: true },
          { name: "Red Flag", a: true, b: false },
          { name: "Blue Ball", a: false, b: true },
          { name: "Pencil", a: false, b: false }
        ]
      },
      {
        setA: "Can Swim",
        setB: "Has Legs",
        items: [
          { name: "Duck", a: true, b: true },
          { name: "Fish", a: true, b: false },
          { name: "Cat", a: false, b: true },
          { name: "Boat", a: false, b: false }
        ]
      }
    ];

    function gameVenn() {
      const theme = vennThemes[randInt(0, vennThemes.length - 1)];
      const item = theme.items[randInt(0, theme.items.length - 1)];
      const labels = [
        `${theme.setA} only`,
        `${theme.setB} only`,
        "Both sets",
        "Neither set"
      ];

      let correctIndex = 3;
      if (item.a && item.b) correctIndex = 2;
      else if (item.a) correctIndex = 0;
      else if (item.b) correctIndex = 1;

      const visualHtml = `
        <div class="venn-box">
          <div class="venn">
            <div class="circle a">${theme.setA}</div>
            <div class="circle b">${theme.setB}</div>
          </div>
          <div class="item-pill">${item.name}</div>
        </div>
      `;

      return {
        prompt: `Where does "${item.name}" belong?`,
        visualHtml,
        options: labels,
        correctIndex,
        points: 18
      };
    }

    function gamePatterns() {
      const start = randInt(1, 8);
      const step = randInt(1, 5);
      const sequence = [start, start + step, start + step * 2, start + step * 3, start + step * 4];
      const missingIndex = randInt(1, 3);
      const answer = sequence[missingIndex];

      const shown = sequence.map((n, idx) => (idx === missingIndex ? "?" : String(n)));
      const data = buildNumericOptions(answer, 0, 35);

      return {
        prompt: "What number is missing in the pattern?",
        visualHtml: `<div class="pathway">${shown.map((n) => `<span class="chip">${n}</span>`).join('<span class="arrow">→</span>')}</div>`,
        options: data.options,
        correctIndex: data.correctIndex,
        points: 12
      };
    }

    const games = {
      addition: { name: "Simple Addition", short: "Addition", run: gameAddition },
      multiplication: { name: "Simple Multiplication", short: "Multiply", run: gameMultiplication },
      division: { name: "Simple Division", short: "Division", run: gameDivision },
      pathway: { name: "Pathway Problems", short: "Pathway", run: gamePathway },
      venn: { name: "Venn Diagrams", short: "Venn", run: gameVenn },
      patterns: { name: "Number Patterns", short: "Patterns", run: gamePatterns }
    };

    function renderPicker() {
      const holder = document.getElementById("game-picker");
      holder.innerHTML = "";

      Object.entries(games).forEach(([key, game]) => {
        const button = document.createElement("button");
        button.className = "game-btn";
        button.dataset.key = key;
        button.textContent = game.name;
        button.addEventListener("click", () => setGame(key));
        holder.appendChild(button);
      });
    }

    function setGame(key) {
      if (!games[key]) return;
      state.gameKey = key;

      if (state.timerId) {
        clearTimeout(state.timerId);
        state.timerId = null;
      }

      document.querySelectorAll(".game-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.key === key);
      });

      const game = games[key];
      document.getElementById("game-name").textContent = game.name;
      document.getElementById("game-short").textContent = game.short;
      nextQuestion();
    }

    function updateStats() {
      document.getElementById("score").textContent = state.score;
      document.getElementById("streak").textContent = state.streak;
      document.getElementById("stars").textContent = Math.floor(state.score / 50);
    }

    function nextQuestion() {
      state.locked = false;
      state.currentQuestion = games[state.gameKey].run();

      document.getElementById("prompt").textContent = state.currentQuestion.prompt;
      document.getElementById("visual").innerHTML = state.currentQuestion.visualHtml || "";
      document.getElementById("feedback").textContent = "";
      document.getElementById("feedback").className = "feedback";
      document.getElementById("mascot").textContent = mascots[randInt(0, mascots.length - 1)];

      const options = document.getElementById("options");
      options.innerHTML = "";
      state.currentQuestion.options.forEach((label, index) => {
        const button = document.createElement("button");
        button.className = "option-btn";
        button.type = "button";
        button.textContent = label;
        button.addEventListener("click", () => submitAnswer(index));
        options.appendChild(button);
      });
    }

    function submitAnswer(index) {
      if (state.locked || !state.currentQuestion) return;
      state.locked = true;

      if (state.timerId) {
        clearTimeout(state.timerId);
        state.timerId = null;
      }

      const buttons = [...document.querySelectorAll(".option-btn")];
      buttons.forEach((button) => {
        button.disabled = true;
      });

      const feedback = document.getElementById("feedback");
      const isCorrect = index === state.currentQuestion.correctIndex;

      if (isCorrect) {
        state.score += state.currentQuestion.points;
        state.streak += 1;
        buttons[index].classList.add("correct");
        feedback.textContent = cheers[randInt(0, cheers.length - 1)];
        feedback.className = "feedback ok";
        updateStats();
        state.timerId = setTimeout(nextQuestion, 1000);
      } else {
        state.streak = 0;
        buttons[index].classList.add("wrong");
        buttons[state.currentQuestion.correctIndex].classList.add("correct");
        const rightAnswer = state.currentQuestion.options[state.currentQuestion.correctIndex];
        feedback.textContent = `Good try. The answer was ${rightAnswer}.`;
        feedback.className = "feedback nope";
        updateStats();
        state.timerId = setTimeout(nextQuestion, 1600);
      }
    }

    renderPicker();
    updateStats();
    setGame("addition");
  </script>
</body>
</html>
