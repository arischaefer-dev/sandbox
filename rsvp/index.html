<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RSVP">
  <meta name="theme-color" content="#2563eb">
  <title>RSVP Reader</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
</head>
<body>

  <!-- ── Library View ── -->
  <div id="library-view" class="view">
    <header class="header">
      <h1>RSVP Reader</h1>
      <button id="load-btn" class="btn-primary">+ Load PDF</button>
    </header>
    <div id="stats-bar" class="stats-bar">
      <span id="stats-text"></span>
    </div>
    <main id="library-main">
      <div id="drop-zone" class="drop-zone">
        <div class="drop-icon">📄</div>
        <h3>Drop a PDF here</h3>
        <p>or click to browse your files</p>
      </div>
      <div id="session-list" class="session-list hidden"></div>
    </main>
    <input type="file" id="file-input" accept=".pdf" hidden>
  </div>

  <!-- ── Reader View ── -->
  <div id="reader-view" class="view hidden">
    <header class="reader-header">
      <button id="back-btn" class="btn-back">&#8592; Library</button>
      <span id="reader-title" class="reader-title"></span>
      <button id="chapters-btn" class="btn-chapters" title="Jump to page">≡</button>
    </header>

    <div class="progress-section">
      <div class="progress-track" id="progress-track" title="Click to seek">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <div class="progress-meta">
        <span id="progress-text" class="progress-text">0 / 0</span>
        <span id="time-remaining" class="time-remaining"></span>
      </div>
    </div>

    <div class="word-stage" id="word-stage">
      <div id="loading-state" class="state-panel">
        <div class="spinner"></div>
        <p>Extracting text&hellip;</p>
      </div>

      <div id="word-display" class="word-display hidden">
        <div class="focus-line"></div>
        <div class="word-row">
          <span id="word-before" class="word-seg seg-before"></span>
          <span id="word-pivot"  class="word-seg seg-pivot"></span>
          <span id="word-after"  class="word-seg seg-after"></span>
        </div>
        <div id="context-line" class="context-line"></div>
      </div>

      <div id="finished-state" class="state-panel hidden">
        <div class="big-check">✓</div>
        <p class="finished-label">Finished!</p>
        <button id="restart-btn" class="btn-primary">Read Again</button>
      </div>

      <div id="error-state" class="state-panel hidden">
        <div class="error-icon">⚠</div>
        <p id="error-msg" class="error-msg"></p>
        <button id="back-from-error" class="btn-secondary">Go Back</button>
      </div>
    </div>

    <div class="controls">
      <div class="controls-top">
        <div class="wpm-row">
          <button id="wpm-down" class="btn-round" title="Slower (↓">−</button>
          <div class="wpm-display">
            <span id="wpm-value">250</span>
            <span class="wpm-label">WPM</span>
          </div>
          <button id="wpm-up" class="btn-round" title="Faster (↑)">+</button>
        </div>

        <div class="chunk-control">
          <span class="chunk-label">Words</span>
          <div class="chunk-btns">
            <button class="btn-chunk active" data-chunk="1">1</button>
            <button class="btn-chunk" data-chunk="2">2</button>
            <button class="btn-chunk" data-chunk="3">3</button>
          </div>
        </div>

        <label class="smart-label">
          <input type="checkbox" id="smart-pace" checked>
          <span>Smart<br>pace</span>
        </label>
      </div>

      <div class="playback-row">
        <button id="skip-back" class="btn-skip" title="Back 10 words (←)">
          <span class="skip-icon">⏮</span>
          <span class="skip-label">&minus;10</span>
        </button>
        <button id="play-pause" class="btn-play" title="Play / Pause (Space)" disabled>▶</button>
        <button id="skip-fwd" class="btn-skip" title="Forward 10 words (→)">
          <span class="skip-label">+10</span>
          <span class="skip-icon">⏭</span>
        </button>
      </div>

      <p class="hint">Space&nbsp;·&nbsp;play/pause &nbsp;·&nbsp; ←/→&nbsp;skip &nbsp;·&nbsp; ↑/↓&nbsp;speed</p>
    </div>
  </div>

  <!-- ── Chapters Modal ── -->
  <div id="chapters-modal" class="modal hidden">
    <div id="modal-backdrop" class="modal-backdrop"></div>
    <div class="modal-sheet">
      <div class="modal-header">
        <span>Jump to Page</span>
        <button id="close-chapters" class="btn-close">&times;</button>
      </div>
      <div id="chapters-list" class="chapters-list"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
